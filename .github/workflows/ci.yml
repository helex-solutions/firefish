name: CI

# One workflow: test on every PR and push; publish both images on main and on a v* tag.
#
# GitHub-hosted runners on purpose. This repository is public, and a public repository must not
# route pull requests from forks onto the org's self-hosted pool.
#
# Both images carry the same tags — the short commit sha, `latest` on main, and the bare version
# on a v* tag — so a consumer pins ONE string and gets the runnable service and the carrier that
# match. helex-tx pins `firefish-app:<sha or version>` in its build-tx.yml (FIREFISH_APP_IMAGE).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded PR run is a stale opinion; a main or tag run publishes, so let it finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/helex-solutions/firefish
  # build-push-action otherwise uploads a build record artifact per run that nothing reads.
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The SUSHI/GoFSH round trip (FIREFISH_E2E=1) downloads FHIR packages on first run and is
      # left off here, as it was in the suite's quality gate.
      - run: npm ci
      - run: npm test

  images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for the runnable image
        id: serve
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}
            # A prerelease (v0.2.0-rc1) never moves latest; a stable tag or main does.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && !contains(github.ref_name, '-')) }}

      - name: Tags for the carrier
        id: app
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-app
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && !contains(github.ref_name, '-')) }}

      # A PR builds both targets without pushing, so a broken Dockerfile fails before merge.
      - name: Build and push the runnable image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: serve
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.serve.outputs.tags }}
          labels: ${{ steps.serve.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the carrier
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.app.outputs.tags }}
          labels: ${{ steps.app.outputs.labels }}
          provenance: false
          cache-from: type=gha
