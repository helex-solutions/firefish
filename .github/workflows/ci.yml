name: CI

# Tests on every PR and push. Publishes ONLY when package.json's version was bumped.
#
# RELEASING. The version lives in package.json (the value /health reports). To release, bump it
# in a PR (`npm version 1.3.0 --no-git-tag-version` keeps package-lock.json in step) and merge.
# The push to main finds a version above everything published and publishes it; every other push
# to main runs the tests and publishes nothing. This is forge's publish-on-bump model:
# scripts/check-version.mjs compares the source version with the registry and decides.
#
# A release publishes both images with the same tags — the version, the short commit sha, and
# `latest` unless the version is a prerelease (1.3.0-rc.1) — and tags the commit `v<version>`.
# helex-tx pins `firefish-app:<version>` in its build-tx.yml (FIREFISH_APP_IMAGE).
#
# GitHub-hosted runners on purpose. This repository is public, and a public repository must not
# route pull requests from forks onto the org's self-hosted pool.

on:
  push:
    branches: [main]
  pull_request:
  # Re-runs the same decision — for retrying a release whose publish failed. It cannot overwrite
  # a published version: versions are immutable, so a fix ships as the next one.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded PR run is a stale opinion; a main run may be publishing, so let it finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/helex-solutions/firefish
  # build-push-action otherwise uploads a build record artifact per run that nothing reads.
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The SUSHI/GoFSH round trip (FIREFISH_E2E=1) downloads FHIR packages on first run and is
      # left off here.
      - run: npm ci
      - run: npm test

  # On a PR this only reports: the summary says whether merging it would cut a release.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compare package.json with the registry
        id: check
        run: |
          set -euo pipefail
          node scripts/check-version.mjs 2> reason.txt | tee -a "$GITHUB_OUTPUT"
          cat reason.txt
          { echo "### Release"; echo; cat reason.txt; } >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: [test, version]
    # A PR always builds both targets without pushing, so a broken Dockerfile fails before merge.
    # On main the build runs only for a release.
    if: github.event_name == 'pull_request' || needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the v<version> tag
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && needs.version.outputs.publish == 'true' }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for the runnable image
        id: serve
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease != 'true' }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Tags for the carrier
        id: app
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-app
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease != 'true' }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Build and push the runnable image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: serve
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.serve.outputs.tags }}
          labels: ${{ steps.serve.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the carrier
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.app.outputs.tags }}
          labels: ${{ steps.app.outputs.labels }}
          provenance: false
          cache-from: type=gha

      # After both pushes, so a tag never names a release that did not publish. A tag that already
      # exists (a dispatch retrying a half-finished release) is left alone.
      - name: Tag the commit v${{ env.VERSION }}
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists — leaving it"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" >/dev/null
            echo "tagged ${GITHUB_SHA} as ${tag}"
          fi
          echo "Published \`firefish:${VERSION}\` and \`firefish-app:${VERSION}\`. Pin \`FIREFISH_APP_IMAGE: ghcr.io/helex-solutions/firefish-app:${VERSION}\` in helex-tx's build-tx.yml." >> "$GITHUB_STEP_SUMMARY"
